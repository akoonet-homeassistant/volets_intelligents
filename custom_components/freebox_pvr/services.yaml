record:
  fields:
    entity_id:
      example: sensor.programme_tnt_fr_tf1
      selector:
        entity:
          integration: programme_tnt_fr
          domain: sensor
    slot:
      default: current
      selector:
        select:
          translation_key: slot
          options:
            - current
            - next
            - prime_time
            - second_part
    channel_name:
      example: "France 2"
      selector:
        text:
    channel_uuid:
      example: "uuid-webtv-201"
      selector:
        text:
    title:
      example: "Le film du dimanche"
      selector:
        text:
    subtitle:
      selector:
        text:
    start:
      example: "2026-11-23T21:10:00+01:00"
      selector:
        datetime:
    end:
      example: "2026-11-23T22:55:00+01:00"
      selector:
        datetime:
    end_time:
      example: "00:45"
      selector:
        time:
    repeat_weekly:
      default: false
      selector:
        boolean:
    margin_before:
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: min
          mode: box
    margin_after:
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: min
          mode: box
    quality:
      selector:
        select:
          translation_key: quality
          options:
            - auto
            - hd
            - sd
            - ld
    config_entry_id:
      selector:
        config_entry:
          integration: freebox_pvr

